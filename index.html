<body>
    <h2>Student Registeration Form</h2>
    <form action="">
    <label for="">Full Name:</label>
    <br>
    <input type="text" placeholder="Enter Your Name" required>
    <br>
    <br>
   <label for="">Email:</label>
    <br>
    <input type="email" placeholder="Enter Your Email" required>
    <br>
    <br>
    <label for="">Password:</label>
    <br>
    <input type="password" required>
    <br>
    <br>
    <label for>Gender:</label>
    <br>
    <label for="male"><input type=radio name="Gender" id="male">Male</label>
    <label for="female"><input type=radio name="Gender" id="female">Female</label>
    <br>
    <br>
    <label for>Skills:</label>
    <br>
    <label for="html"><input type=checkbox name="" id="html">HTML</label>
    <label for="css"><input type=checkbox name="" id="css">CSS</label>
    <label for="javascript"><input type=checkbox name="" id="javascript">Javascript</label>
    <br>
    <br>
    <label for="DOB">Date of Birth:</label>
    <br>
    <input type="date" required>
    <br>
    <br>
    <button type="submit">Register</button>
    <br>
    </form>
  <hr style="border: none; border-top: 1px solid black;">
